name: Analyze APK with REA

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'URL directa de la APK (ignorar si usas APKMirror)'
        required: false
        type: string
      apkmirror_page_url:
        description: 'URL de la página de APKMirror (ignorar si usas URL directa)'
        required: false
        type: string
      apk_name:
        description: 'Nombre del archivo (ej. target.apk, app.apkm, app.xapk)'
        required: true
        default: 'target.apk'
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (REA requiere >=22.19)
        uses: actions/setup-node@v4
        with:
          node-version: '22.19'

      - name: Setup Java 17 (JADX y APKEditor)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar JADX headless
        run: |
          JADX_VERSION=$(curl -s https://api.github.com/repos/skylot/jadx/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -sSL "https://github.com/skylot/jadx/releases/download/${JADX_VERSION}/jadx-${JADX_VERSION#v}.zip" -o jadx.zip
          unzip -q jadx.zip -d jadx
          echo "$PWD/jadx/bin" >> $GITHUB_PATH

      - name: Descargar APK (Directa o APKMirror)
        run: |
          if [ -n "${{ inputs.apk_url }}" ]; then
            echo "Descargando desde URL directa..."
            curl -L -o "${{ inputs.apk_name }}" "${{ inputs.apk_url }}"
          elif [ -n "${{ inputs.apkmirror_page_url }}" ]; then
            echo "Descargando desde APKMirror..."
            
            # 1. Obtener el HTML de la página principal
            python scripts/cf_get.py "${{ inputs.apkmirror_page_url }}" > page1.html
            
            # 2. Extraer la URL intermedia (con el ?key=)
            KEY_URL=$(python scripts/apkmirror_search.py download < page1.html 2>/dev/null || true)
            
            if [ -n "$KEY_URL" ]; then
              echo "Enlace intermedio obtenido: $KEY_URL"
              # 3. Obtener el HTML de la página intermedia
              python scripts/cf_get.py "$KEY_URL" > page2.html
              # 4. Extraer el enlace FINAL del archivo
              FINAL_URL=$(python scripts/apkmirror_search.py final < page2.html)
            else
              # Si falló el paso 2, intentar sacar el enlace final directo
              FINAL_URL=$(python scripts/apkmirror_search.py final < page1.html)
            fi
            
            echo "Enlace FINAL obtenido: $FINAL_URL"
            
            # 5. Descargar archivo (Argumentos posicionales: URL, Destino, Referer)
            python scripts/cf_get.py download "$FINAL_URL" "${{ inputs.apk_name }}" "${{ inputs.apkmirror_page_url }}"
          else
            echo "ERROR: Debes proporcionar apk_url o apkmirror_page_url."
            exit 1
          fi
          ls -lh "${{ inputs.apk_name }}"

      - name: Fusionar Splits (si es necesario)
        run: |
          # Descargar APKEditor obteniendo la URL real (evita el error 404)
          APKEDITOR_URL=$(curl -s https://api.github.com/repos/REAndroid/APKEditor/releases/latest | grep '"browser_download_url"' | grep '\.jar"' | head -n1 | cut -d'"' -f4)
          curl -sSL "$APKEDITOR_URL" -o APKEditor.jar
          
          if [[ "${{ inputs.apk_name }}" == *.apkm || "${{ inputs.apk_name }}" == *.xapk || "${{ inputs.apk_name }}" == *.apks ]]; then
            echo "Detectado archivo de splits. Fusionando..."
            java -jar APKEditor.jar m -i "${{ inputs.apk_name }}" -o merged.apk
            ANALYZE_TARGET="merged.apk"
          else
            echo "APK única. Omitiendo merge."
            cp "${{ inputs.apk_name }}" merged.apk
            ANALYZE_TARGET="merged.apk"
          fi
          echo "TARGET=$ANALYZE_TARGET" >> $GITHUB_ENV

      - name: Descargar JADX Headless para REA
        run: |
          mkdir -p "$HOME/.local/share/rea/android"
          curl -fL -o "$HOME/.local/share/rea/android/jadx-headless-mcp-0.7.1-all.jar" \
            https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar
          echo "REA_JADX_MCP_JAR=$HOME/.local/share/rea/android/jadx-headless-mcp-0.7.1-all.jar" >> $GITHUB_ENV

      - name: Análisis con REA
        run: |
          echo "Ejecutando REA sobre ${{ env.TARGET }}..."
          npx -y rea-agents@latest inspect-android-package "${{ env.TARGET }}" --json > rea-output.json

      - name: Descompilación con JADX (Deofuscado)
        run: |
          echo "Generando código deofuscado..."
          jadx --deobf -d jadx-full "${{ env.TARGET }}"

      - name: Subir Artefacto de Análisis
        uses: actions/upload-artifact@v4
        with:
          name: analisis-apk-${{ github.run_id }}
          path: |
            rea-output.json
            jadx-full/
          retention-days: 7